# sops 加密规则：只对 secrets/ 下的 yaml 生效
# 生成 age 密钥后把公钥填入下面 keys 段（age-keygen -y ~/.config/sops/age/keys.txt）
keys:
  - &orion age14v8pr3ucfr9355u2rtqrcg75edjvq3ntd30j3fqryg2jmzccfdhqchkxu7
  # aliyun：由其 SSH host key 派生（ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub）
  - &aliyun age1m5qh9pz6n5s3mf7alkw8vld6k2v2xdxplysjc2wwntddjfk8c55q78qhfd
  # lightsail：由其 SSH host key 派生（同上，在 lightsail 上取 pub key）
  - &lightsail age1autpg6dygq7rtzq4aqzc9km8r6vdtmvp9kcqne7rlmkl8v3pmeashnlzne

creation_rules:
  # EasyTier 网络口令：桌面 + aliyun + lightsail 都能解密。规则必须排在通用规则前面（sops 取首个匹配）
  - path_regex: secrets/easytier\.yaml$
    key_groups:
      - age:
          - *orion
          - *aliyun
          - *lightsail
  # Vaultwarden 管理令牌：桌面可编辑、lightsail 可解密（其它主机均不需要）
  - path_regex: secrets/vaultwarden\.yaml$
    key_groups:
      - age:
          - *orion
          - *lightsail
  # Cloudflare Origin CA 证书/私钥（*.liyinuo.tech，15 年）：只有桌面能解，
  # 哪台主机要在 Cloudflare 后面收 TLS 时再把它加进接收者（然后 sops updatekeys）。
  - path_regex: secrets/cloudflare-origin\.yaml$
    key_groups:
      - age:
          - *orion
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *orion
